[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parareal-spectral-sl"
version = "1.0.0"
description = "Spectral semi-Lagrangian coarse propagator for the Parareal solution of the 1-D wave equation"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Shijian Wang" }]
keywords = [
    "parareal",
    "parallel-in-time",
    "semi-Lagrangian",
    "spectral methods",
    "wave equation",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.20",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Source = "https://github.com/Shijian66/parareal-spectral-sl"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["propagator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
